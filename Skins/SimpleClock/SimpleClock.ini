; ==========================================================================
; SimpleClock — Rainmeter Skin
;
; A minimal, elegant desktop clock centered on your wallpaper.
; Displays time down to the second with a frosted-glass card effect.
;
; Installation:
;   Option A (easy) — Double-click SimpleClock.rmskin to auto-install
;   Option B (manual):
;     1. Copy the "SimpleClock" folder to:
;        %USERPROFILE%\Documents\Rainmeter\Skins\
;     2. Open Rainmeter → Refresh All → Load SimpleClock\SimpleClock.ini
;
; Customisation tips inside — search for "[CUSTOMISE]"
; ==========================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=0
; ── Frosted glass: blurs the wallpaper under the card (Win 10+ only) ──
Blur=1
BlurRegion=RoundRect 0,0,500,200,20,20
; ── Centred on the primary monitor ──
WindowX=(#SCREENAREAWIDTH#/2-250)
WindowY=(#SCREENAREAHEIGHT#/2-100)

[Metadata]
Name=SimpleClock
Author=SimpleClock
Information=Elegant, centred clock showing time down to the second.
License=MIT
Version=1.0.0

; ==========================================================================
; VARIABLES  — tweak these to customise the look  [CUSTOMISE]
; ==========================================================================
[Variables]

; ── Card ──────────────────────────────────────────────────────────────────
; Dark navy semi-transparent background. Last value is alpha (0–255).
CardFill=8,10,28,185
; Subtle white border around the card
CardBorder=255,255,255,30

; ── Time ──────────────────────────────────────────────────────────────────
; Change FontFace to any font installed on your system.
TimeFace=Segoe UI Light
; 72 = large and bold; lower for a smaller display
TimeSize=72
TimeColor=255,255,255,255

; ── Date ──────────────────────────────────────────────────────────────────
DateFace=Segoe UI
DateSize=14
; Soft cool-blue tint to contrast the pure-white time
DateColor=175,200,255,210

; ── Separator line ────────────────────────────────────────────────────────
SepColor=255,255,255,35

; ==========================================================================
; MEASURES
; ==========================================================================

[MeasureTime]
Measure=Time
; [CUSTOMISE] For 12-hour clock with AM/PM, replace with: %I:%M:%S %p
Format=%H:%M:%S

[MeasureDate]
Measure=Time
; [CUSTOMISE] Format reference: %A=weekday  %B=month  %#d=day  %Y=year
Format=%A, %B %#d %Y


; ==========================================================================
; METERS — drawn in order (back to front)
; ==========================================================================

; ── 1. Main frosted card ──────────────────────────────────────────────────
;    Rectangle X,Y,W,H,CornerRadius
[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,500,200,20 | Fill Color #CardFill# | Stroke Color #CardBorder# | StrokeWidth 1

; ── 2. Top-edge gloss highlight (subtle glass reflection) ─────────────────
[MeterGloss]
Meter=Shape
Shape=Rectangle 1,1,498,80,19 | Fill Color 255,255,255,9 | StrokeWidth 0

; ── 3. Time ───────────────────────────────────────────────────────────────
;    StringAlign=CenterCenter → X,Y is the anchor point of the text centre
[MeterTime]
Meter=String
MeasureName=MeasureTime
X=250
Y=88
W=480
H=100
StringAlign=CenterCenter
FontColor=#TimeColor#
FontSize=#TimeSize#
FontFace=#TimeFace#
AntiAlias=1
ClipString=0

; ── 4. Separator line ─────────────────────────────────────────────────────
[MeterSeparator]
Meter=Shape
Shape=Line 55,143,445,143 | Stroke Color #SepColor# | StrokeWidth 1

; ── 5. Date ───────────────────────────────────────────────────────────────
[MeterDate]
Meter=String
MeasureName=MeasureDate
X=250
Y=173
W=460
H=26
StringAlign=CenterCenter
FontColor=#DateColor#
FontSize=#DateSize#
FontFace=#DateFace#
AntiAlias=1
ClipString=0
